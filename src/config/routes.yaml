# Главная страница (frontend)
app_home:
    path: /
    controller: App\Controller\HomeController::index
    methods: [GET]

# API routes
api_categories:
    path: /api/categories
    controller: App\Controller\Api\CategoryController::index
    methods: [GET]

api_categories_show:
    path: /api/categories/{id}
    controller: App\Controller\Api\CategoryController::show
    methods: [GET]

api_products:
    path: /api/products
    controller: App\Controller\Api\ProductController::index
    methods: [GET]

api_products_featured:
    path: /api/products/featured
    controller: App\Controller\Api\ProductController::featured
    methods: [GET]

api_products_show:
    path: /api/products/{id}
    controller: App\Controller\Api\ProductController::show
    methods: [GET]

api_cart:
    path: /api/cart
    controller: App\Controller\Api\CartController::getCart
    methods: [GET]

api_cart_add:
    path: /api/cart/items
    controller: App\Controller\Api\CartController::addItem
    methods: [POST]

api_cart_update:
    path: /api/cart/items/{id}
    controller: App\Controller\Api\CartController::updateItem
    methods: [PUT]

api_cart_remove:
    path: /api/cart/items/{id}
    controller: App\Controller\Api\CartController::removeItem
    methods: [DELETE]

api_cart_clear:
    path: /api/cart/clear
    controller: App\Controller\Api\CartController::clear
    methods: [POST]

api_orders_create:
    path: /api/orders
    controller: App\Controller\Api\OrderController::create
    methods: [POST]

api_orders_list:
    path: /api/orders
    controller: App\Controller\Api\OrderController::list
    methods: [GET]

api_orders_show:
    path: /api/orders/{orderNumber}
    controller: App\Controller\Api\OrderController::show
    methods: [GET]

api_webhooks_payment:
    path: /api/webhooks/payment
    controller: App\Controller\Api\WebhookController::handlePaymentWebhook
    methods: [POST]

api_webhooks_payment_test:
    path: /api/webhooks/payment/test
    controller: App\Controller\Api\WebhookController::test
    methods: [GET]

# Admin login route
admin_login:
    path: /admin/login
    controller: App\Controller\Admin\SecurityController::login

# Admin logout route (handled by security firewall)
admin_logout:
    path: /admin/logout
