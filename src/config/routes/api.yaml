# API routes
api_categories:
    path: /api/categories
    controller: App\Controller\Api\CategoryController
    methods: GET

api_categories_show:
    path: /api/categories/{id}
    controller: App\Controller\Api\CategoryController::show
    methods: GET

api_products:
    path: /api/products
    controller: App\Controller\Api\ProductController
    methods: GET

api_products_featured:
    path: /api/products/featured
    controller: App\Controller\Api\ProductController::featured
    methods: GET

api_products_show:
    path: /api/products/{id}
    controller: App\Controller\Api\ProductController::show
    methods: GET

api_cart:
    path: /api/cart
    controller: App\Controller\Api\CartController
    methods: [GET, POST, PUT, DELETE]

api_orders:
    path: /api/orders
    controller: App\Controller\Api\OrderController
    methods: [POST, GET]

api_orders_show:
    path: /api/orders/{orderNumber}
    controller: App\Controller\Api\OrderController::show
    methods: GET

api_webhooks_payment:
    path: /api/webhooks/payment
    controller: App\Controller\Api\WebhookController
    methods: POST

# Admin routes
admin_products:
    path: /api/admin/products
    controller: App\Controller\Admin\ProductController
    methods: [GET, POST, PUT, DELETE]
